<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Article | DevPublish</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <!-- ============================== -->
    <!-- HEADER -->
    <!-- ============================== -->

    <header class="site-header">

        <div class="header-container">

            <a href="../index.html" class="logo">
                DevPublish
            </a>

            <nav class="main-nav">
                <a href="../index.html">Home</a>
                <a href="explore.html">Explore</a>
                <a href="topics.html">Topics</a>
            </nav>

            <div class="header-actions">

                <div id="guestActions">
                    <a href="login.html" class="btn btn-secondary">
                        Login
                    </a>

                    <a href="register.html" class="btn btn-primary">
                        Get Started
                    </a>
                </div>

                <div id="userActions" hidden>

                    <div class="avatar-wrapper">

                        <button id="avatarCircle" class="avatar-circle">
                            U
                        </button>

                        <div class="avatar-dropdown">

                            <a href="profile.html">
                                Profile
                            </a>

                            <a href="dashboard.html">
                                Dashboard
                            </a>

                            <a href="settings.html">
                                Settings
                            </a>

                            <button id="logoutBtn">
                                Log out
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </header>


    <!-- ============================== -->
    <!-- ARTICLE -->
    <!-- ============================== -->

    <main>

        <article class="article-page">

            <div id="articleContainer">

                <div class="article-loading">
                    Loading article...
                </div>

            </div>

        </article>

    </main>


    <!-- ============================== -->
    <!-- FOOTER -->
    <!-- ============================== -->

    <footer class="site-footer">

        <div class="footer-container">

            <p>
                © 2026 DevPublish. A publishing platform for developers,
                students and technical writers.
            </p>

        </div>

    </footer>


    <!-- ============================== -->
    <!-- JAVASCRIPT -->
    <!-- ============================== -->

    <script src="../js/auth.js"></script>

    <script>

        const articleContainer =
            document.getElementById("articleContainer");


        async function loadArticle() {

            try {

                // Get slug from URL
                const params =
                    new URLSearchParams(window.location.search);

                const slug = params.get("slug");


                if (!slug) {

                    articleContainer.innerHTML = `
                        <div class="article-error">
                            <h2>Article not found</h2>
                            <p>No article slug was provided.</p>
                            <a href="explore.html">
                                Back to Explore
                            </a>
                        </div>
                    `;

                    return;
                }


                // Request article from backend
                const response = await fetch(
                    `https://devpublish-8ww4nfm8u-shivarathriajay72-9888.vercel.app/api/posts/${encodeURIComponent(slug)}`
                );


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message || "Unable to load article"
                    );

                }


                const post = data.post;

                const currentUser = getCurrentUser();

const currentUserId =
    currentUser?._id || currentUser?.id;

const isAuthor =
    currentUserId &&
    currentUserId === post.author?._id;


                const authorName =
                    post.author?.name ||
                    post.author?.username ||
                    "DevPublish Author";


                const tags =
                    post.tags || [];


                const publishedDate =
                    new Date(post.createdAt)
                        .toLocaleDateString();


                const tagsHTML =
                    tags.map(function(tag) {

                        return `
                            <span class="topic-tag">
                                ${escapeHtml(tag)}
                            </span>
                        `;

                    }).join("");


                articleContainer.innerHTML = `

                    <div class="article-header">

                        <div class="article-tags">
                            ${tagsHTML}
                        </div>

                        <h1>
                            ${escapeHtml(post.title)}
                        </h1>

                        <p class="article-excerpt">
                            ${escapeHtml(post.excerpt || "")}
                        </p>


                        <div class="article-meta">

                            <span>
                                By ${escapeHtml(authorName)}
                            </span>

                            <span>·</span>

                            <span>
                                ${publishedDate}
                            </span>

                            <span>·</span>

                            <span>
                                ${post.views || 0} views
                            </span>

                            <span>·</span>

                            <span>
                                ${post.likes || 0} likes
                            </span>

                        </div>

                    </div>


                    ${
                        post.coverImage
                        ? `
                            <div class="article-cover">

                                <img
                                    src="${escapeHtml(post.coverImage)}"
                                    alt="${escapeHtml(post.title)}"
                                >

                            </div>
                        `
                        : ""
                    }


                    <div class="article-content">

                        ${escapeHtml(post.content)}

                    </div>

                    ${
    isAuthor
    ? `
        <div class="article-actions">

            <a
                href="edit-article.html?id=${encodeURIComponent(post._id)}&slug=${encodeURIComponent(post.slug)}"
                class="btn btn-secondary"
            >
                Edit Article
            </a>

            <button
                type="button"
                id="deleteArticleBtn"
                class="btn btn-danger"
            >
                Delete Article
            </button>

        </div>
    `
    : ""
}

                `;


                // Update browser tab title
                document.title =
                    `${post.title} | DevPublish`;


            } catch (error) {

                console.error(
                    "Article loading error:",
                    error
                );


                articleContainer.innerHTML = `

                    <div class="article-error">

                        <h2>
                            Unable to load article
                        </h2>

                        <p>
                            Please make sure the DevPublish
                            backend is running.
                        </p>

                        <a href="explore.html">
                            Back to Explore
                        </a>

                    </div>

                `;

            }

        }


        function escapeHtml(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value || "";

            return div.innerHTML;

        }


       document.addEventListener(
    "DOMContentLoaded",
    async function () {

        await loadArticle();

        const deleteButton =
            document.getElementById("deleteArticleBtn");

        if (!deleteButton) {
            return;
        }

        deleteButton.addEventListener(
            "click",
            async function () {

                const confirmed =
                    confirm(
                        "Are you sure you want to delete this article? This action cannot be undone."
                    );

                if (!confirmed) {
                    return;
                }

                try {

                    deleteButton.disabled = true;

                    deleteButton.textContent =
                        "Deleting...";

                    const params =
                        new URLSearchParams(
                            window.location.search
                        );

                    const slug =
                        params.get("slug");

                    const token =
                        getToken();

                    if (!token) {
                        alert("Please login first.");
                        return;
                    }

                    // Get the article first so we know its ID
                    const articleResponse =
                        await fetch(
                            `https://devpublish-8ww4nfm8u-shivarathriajay72-9888.vercel.app/api/posts/${encodeURIComponent(slug)}`
                        );

                    const articleData =
                        await articleResponse.json();

                    if (!articleResponse.ok) {
                        throw new Error(
                            articleData.message ||
                            "Unable to find article"
                        );
                    }

                    const post =
                        articleData.post;

                    const deleteResponse =
                        await fetch(
                            `https://devpublish-8ww4nfm8u-shivarathriajay72-9888.vercel.app/api/posts/${post._id}`,
                            {
                                method: "DELETE",

                                headers: {
                                    "Authorization":
                                        `Bearer ${token}`
                                }
                            }
                        );

                    const deleteData =
                        await deleteResponse.json();

                    if (!deleteResponse.ok) {
                        throw new Error(
                            deleteData.message ||
                            "Unable to delete article"
                        );
                    }

                    alert(
                        "Article deleted successfully."
                    );

                    window.location.href =
                        "explore.html";

                } catch (error) {

                    console.error(
                        "Delete article error:",
                        error
                    );

                    alert(
                        error.message ||
                        "Unable to delete article."
                    );

                    deleteButton.disabled = false;

                    deleteButton.textContent =
                        "Delete Article";
                }
            }
        );
    }
);

    </script>

</body>
</html>
