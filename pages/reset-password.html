<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - DevPublish</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<main id="main">

    <section class="auth-section">

        <div class="cell auth-card" style="max-width:480px;margin:0 auto;">

            <span class="eyebrow">Account recovery</span>

            <h1 class="auth-title">Choose a new password</h1>

            <p class="hero-sub auth-sub">
                Enter a new password for your DevPublish account.
            </p>

            <form class="auth-form" id="resetForm" novalidate>

                <div class="form-alert" id="resetAlert" hidden role="alert"></div>

                <label class="field">
                    <span>New password</span>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        required
                    >
                </label>

                <label class="field">
                    <span>Confirm new password</span>

                    <input
                        type="password"
                        name="confirmPassword"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        required
                    >
                </label>

                <span class="btn-primary-wrap auth-submit-wrap">

                    <button
                        type="submit"
                        class="btn btn-primary auth-submit"
                        id="resetSubmit"
                    >
                        <span>Reset password</span>
                    </button>

                </span>

            </form>

            <p class="auth-switch">
                Remembered your password?
                <a href="login.html" class="auth-link">
                    Back to login
                </a>
            </p>

        </div>

    </section>

</main>


<script>

(function () {

    "use strict";

    const form = document.getElementById("resetForm");
    const alertBox = document.getElementById("resetAlert");
    const submitBtn = document.getElementById("resetSubmit");

    // Get reset token from URL
    const params = new URLSearchParams(window.location.search);

    const token = params.get("token");


    // No token
    if (!token) {

        alertBox.textContent =
            "Invalid or missing password reset link.";

        alertBox.hidden = false;

        submitBtn.disabled = true;

        return;
    }


    form.addEventListener("submit", async function (e) {

        e.preventDefault();

        alertBox.hidden = true;

        const password =
            form.password.value;

        const confirmPassword =
            form.confirmPassword.value;


        // Validate password
        if (password.length < 6) {

            alertBox.textContent =
                "Password must be at least 6 characters.";

            alertBox.hidden = false;

            return;
        }


        // Confirm password
        if (password !== confirmPassword) {

            alertBox.textContent =
                "Passwords do not match.";

            alertBox.hidden = false;

            return;
        }


        submitBtn.disabled = true;

        submitBtn.querySelector("span").textContent =
            "Resetting...";


        try {

            const response = await fetch(
                "https://devpublish-8ww4nfm8u-shivarathriajay72-9888.vercel.app/api/users/reset-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        token: token,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Password reset failed"
                );

            }


            alertBox.textContent =
                "Password reset successfully! Redirecting to login...";

            alertBox.hidden = false;


            setTimeout(function () {

                window.location.href = "login.html";

            }, 1500);


        } catch (error) {

            console.error(
                "Reset password error:",
                error
            );

            alertBox.textContent =
                error.message ||
                "Unable to reset password.";

            alertBox.hidden = false;

        } finally {

            submitBtn.disabled = false;

            submitBtn.querySelector("span").textContent =
                "Reset password";

        }

    });

})();

</script>

</body>
</html>
